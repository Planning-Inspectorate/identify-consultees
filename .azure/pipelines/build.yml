# just wait for PR to run on main as a tirgger
pr: none
trigger: none

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: github.com_Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.30.0
  pipelines:
    - pipeline: pr
      source: PR
      trigger:
        branches:
          include:
            - main

extends:
  template: stages/wrapper_ci.yml@templates
  parameters:
    gitFetchDepth: 0
    globalVariables:
      - template: .azure/pipelines/variables.yml@self
    validationJobs:
      - name: Docker Build Web
        steps:
          - template: ../steps/azure_web_app_docker_build_push.yml@templates
            parameters:
              azurecrName: $(azurecrName)
              dockerfilePath: $(Build.SourcesDirectory)/apps/manage/Dockerfile
              repository: consultees/web
              buildArgs:
                - GIT_SHA=$(Build.SourceVersion)
      - name: Function Build
        # builds apps/function-python - the orchestrator Function App (infrastructure/app-function.tf)
        # was repurposed from Node to Python, since apps/function (Node) was unused boilerplate.
        # Same artifact name as before (orchestrator-functions) so deploy.yml needs no changes.
        steps:
          # UsePythonVersion@0 downloads a prebuilt Python from GitHub's actions/python-versions
          # releases and fails on this pool (pins-odt-agent-pool, self-hosted) with
          # "libpython3.12.so.1.0: cannot open shared object file" (see pr.yml's Python Function
          # Lint & Tests job for the same issue). There we could fall back to the agent's own
          # system python3, but that's Python 3.10 here - unlike lint/test, this step's output is
          # the real deployed artifact, and packages installed under 3.10 aren't guaranteed
          # ABI-compatible with the Function App's Python 3.12 runtime (infrastructure/app-function.tf).
          # Run the install in an actual Python 3.12 container instead, matching the deployed runtime.
          - script: |
              set -e
              docker run --rm \
                --user "$(id -u):$(id -g)" \
                -v "$(Build.Repository.LocalPath)/apps/function-python:/app" \
                -w /app \
                python:3.12-slim \
                python -m pip install -r requirements.txt --target=.python_packages/lib/site-packages
            workingDirectory: $(Build.Repository.LocalPath)/apps/function-python
            displayName: 'Install dependencies for packaging (Python 3.12 via Docker)'
          - task: ArchiveFiles@2
            displayName: Archive files
            inputs:
              rootFolderOrFile: $(Build.Repository.LocalPath)/apps/function-python
              includeRootFolder: false
              archiveFile: $(System.DefaultWorkingDirectory)/functions.zip
          - publish: $(System.DefaultWorkingDirectory)/functions.zip
            artifact: orchestrator-functions
            displayName: Publish Functions Artifact
