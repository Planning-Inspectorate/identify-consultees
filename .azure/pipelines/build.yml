# just wait for PR to run on main as a tirgger
pr: none
trigger: none

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.30.0
  pipelines:
    - pipeline: pr
      source: PR
      trigger:
        branches:
          include:
            - main

extends:
  template: stages/wrapper_ci.yml@templates
  parameters:
    gitFetchDepth: 0
    globalVariables:
      - template: .azure/pipelines/variables.yml@self
    validationJobs:
      - name: Docker Build Web
        steps:
          - template: ../steps/azure_web_app_docker_build_push.yml@templates
            parameters:
              azurecrName: $(azurecrName)
              dockerfilePath: $(Build.SourcesDirectory)/apps/manage/Dockerfile
              repository: consultees/web
              buildArgs:
                - GIT_SHA=$(Build.SourceVersion)
      - name: Function Build
        # builds apps/function-python - the orchestrator Function App (infrastructure/app-function.tf)
        # was repurposed from Node to Python, since apps/function (Node) was unused boilerplate.
        # Same artifact name as before (orchestrator-functions) so deploy.yml needs no changes.
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
            displayName: 'Use Python 3.12'
          - script: |
              set -e
              python -m pip install --upgrade pip
              # bundle dependencies for zip-deploy, matching Azure Functions' Python packaging convention
              pip install -r requirements.txt --target=.python_packages/lib/site-packages
            workingDirectory: $(Build.Repository.LocalPath)/apps/function-python
            displayName: 'Install dependencies for packaging'
          - task: ArchiveFiles@2
            displayName: Archive files
            inputs:
              rootFolderOrFile: $(Build.Repository.LocalPath)/apps/function-python
              includeRootFolder: false
              archiveFile: $(System.DefaultWorkingDirectory)/functions.zip
          - publish: $(System.DefaultWorkingDirectory)/functions.zip
            artifact: orchestrator-functions
            displayName: Publish Functions Artifact
