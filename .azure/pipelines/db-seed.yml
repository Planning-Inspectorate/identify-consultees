parameters:
  - name: environment
    displayName: Environment
    type: string
    default: Dev
    values:
      - Dev
      - Test
      - Training
      - Prod
  - name: loadFullReferenceData
    displayName: Load the full real reference/case-boundary dataset from blob storage (Dev/Test/Training only - replaces the small sample seed)
    type: boolean
    default: false

pool: pins-odt-agent-pool

pr: none
trigger: none

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: github.com_Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.30.0

variables:
  - template: variables/environments/${{ lower(parameters.environment )}}.yml@templates
  - group: pipeline_secrets

jobs:
  - deployment: Seed_DB
    displayName: Seed ${{ parameters.environment }} SQL Database
    environment: ${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
            - download: none
            - checkout: self
            - template: steps/node_script.yml@templates
              parameters:
                nodeVersion: 24
                script: npm ci --workspace=@pins/identify-consultees-database
            - template: steps/azure_auth.yml@templates
            # kv name is different in the training env (had to be shorter)
            - bash: |
                if [[ $ENVIRONMENT == "training" ]]; then
                  echo "Name: pins-kv-consultees-train (env: $ENVIRONMENT)"
                  echo "##vso[task.setvariable variable=kvName;]pins-kv-consultees-train"
                else
                  echo "Name: pins-kv-consultees-$ENVIRONMENT (env: $ENVIRONMENT)"
                  echo "##vso[task.setvariable variable=kvName;]pins-kv-consultees-$ENVIRONMENT"
                fi
              displayName: Set KV name
              env:
                ENVIRONMENT: $(ENVIRONMENT)
            - template: steps/azure_get_secrets.yml@templates
              parameters:
                keyVaultName: $(kvName)
                secrets:
                  - name: consultees-sql-app-connection-string
                    variable: SQL_CONNECTION_STRING
            - template: steps/node_script.yml@templates
              parameters:
                nodeVersion: 24
                condition: and(in('${{ parameters.environment }}', 'Dev', 'Test', 'Training'), eq(${{ parameters.loadFullReferenceData }}, false))
                environmentVariables:
                  SQL_CONNECTION_STRING: $(SQL_CONNECTION_STRING)
                script: npm run generate && npm run seed
                workingDirectory: $(Build.Repository.LocalPath)/packages/database
            # the small checked-in sample (reference_data.geojson, 80 features) only ever gave
            # enough coverage to demo the feature, not to find real consultees for a real project -
            # confirmed for real: a real project's ruleset run found almost nothing against it. The
            # full, real datasets are tens of MB (too large for git), so they're uploaded to this
            # environment's blob storage container once and loaded from there instead - see
            # import-from-blob.ts and infrastructure/storage.tf.
            - ${{ if eq(parameters.loadFullReferenceData, true) }}:
                - bash: |
                    if [[ $ENVIRONMENT == "training" ]]; then
                      STORAGE_ENV="train"
                    else
                      STORAGE_ENV="$ENVIRONMENT"
                    fi
                    echo "##vso[task.setvariable variable=blobStoreHost;]https://pinsstconsultees$STORAGE_ENV.blob.core.windows.net/"
                  displayName: Set blob storage host
                  condition: in('${{ parameters.environment }}', 'Dev', 'Test', 'Training')
                  env:
                    ENVIRONMENT: $(ENVIRONMENT)
                - template: steps/node_script.yml@templates
                  parameters:
                    nodeVersion: 24
                    condition: in('${{ parameters.environment }}', 'Dev', 'Test', 'Training')
                    environmentVariables:
                      SQL_CONNECTION_STRING: $(SQL_CONNECTION_STRING)
                      BLOB_STORE_HOST: $(blobStoreHost)
                      BLOB_STORE_CONTAINER: consultees-data
                    script: |
                      npm run import-from-blob -- --type=consultee-areas --blob=combined_reference_data_v1.geojson
                      npm run import-from-blob -- --type=case-boundaries --blob=all-project-boundaries.geojson
                    workingDirectory: $(Build.Repository.LocalPath)/packages/database
            - template: steps/node_script.yml@templates
              parameters:
                condition: in('${{ parameters.environment }}', 'Prod')
                nodeVersion: 24
                environmentVariables:
                  SQL_CONNECTION_STRING: $(SQL_CONNECTION_STRING)
                script: npm run seed-prod
                workingDirectory: $(Build.Repository.LocalPath)/packages/database
    workspace:
      clean: all
