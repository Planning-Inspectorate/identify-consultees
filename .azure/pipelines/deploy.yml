parameters:
  - name: schemaMigration
    displayName: Run SQL Database Migration
    type: boolean
    default: true
  - name: deployWeb
    displayName: Deploy the Web
    type: boolean
    default: true

pr: none
trigger: none

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.30.0
  pipelines:
    - pipeline: build
      source: Build
      trigger:
        branches:
          include:
            - main

extends:
  template: stages/wrapper_cd.yml@templates
  parameters:
    variableGroupPrefix: 'cd'
    environments:
      - name: Dev
      - name: Test
        dependsOn:
          - Dev
      - name: Training
        dependsOn:
          - Test
      - name: Prod
        dependsOn:
          - Training
    globalVariables:
      - template: .azure/pipelines/variables.yml@self
    deploymentStages:
      - name: Stage
        deploymentJobs:
          - name: Stage Web
            condition: ${{ eq(parameters.deployWeb, true) }}
            steps:
              - template: ../steps/azure_web_app_deploy_slot.yml@templates
                parameters:
                  appName: pins-app-consultees-web-$(ENVIRONMENT)
                  appResourceGroup: $(resourceGroup)
                  azurecrName: $(azurecrName)
                  repository: consultees/web
              - template: ../steps/azure_web_app_verify_git_hash.yml
                parameters:
                  appName: Web
                  appUrl: $(deploySlotOutputs.slotUrl)/health
                  buildCommit: $(resources.pipeline.build.sourceCommit)
                  auth_enabled: 'false'
                  env: $(ENVIRONMENT)
      - name: Deploy
        dependsOn:
          - Stage
        deploymentJobs:
          - name: Migrate
            condition: ${{ eq(parameters.schemaMigration, true) }}
            steps:
              - bash: |
                  git clone --depth=1 --no-tags --revision="$(resources.pipeline.build.sourceCommit)" $(Build.Repository.Uri) .
                displayName: Checkout Build-Commit
              - ${{ if eq(parameters.schemaMigration, true) }}:
                  # kv name is different in the training env (had to be shorter)
                  - bash: |
                      if [[ $ENVIRONMENT == "training" ]]; then
                        echo "Name: pins-kv-consultees-train (env: $ENVIRONMENT)"
                        echo "##vso[task.setvariable variable=kvName;]pins-kv-consultees-train"
                      else
                        echo "Name: pins-kv-consultees-$ENVIRONMENT (env: $ENVIRONMENT)"
                        echo "##vso[task.setvariable variable=kvName;]pins-kv-consultees-$ENVIRONMENT"
                      fi
                    displayName: Set KV name
                    env:
                      ENVIRONMENT: $(ENVIRONMENT)
              - template: ../steps/azure_get_secrets.yml@templates
                parameters:
                  keyVaultName: $(kvName)
                  secrets:
                    - name: consultees-sql-admin-connection-string
                      variable: SQL_CONNECTION_STRING_ADMIN
                    - name: consultees-sql-app-connection-string
                      variable: SQL_CONNECTION_STRING
              - template: ../steps/node_script.yml@templates
                parameters:
                  nodeVersion: 22
                  script: npm ci --workspace=@pins/identify-consultees-database
                  workingDirectory: $(Build.Repository.LocalPath)
              - ${{ if eq(parameters.schemaMigration, true) }}:
                  - template: ../steps/node_script.yml@templates
                    parameters:
                      nodeVersion: 22
                      environmentVariables:
                        SQL_CONNECTION_STRING_ADMIN: $(SQL_CONNECTION_STRING_ADMIN)
                      script: npm run migrate-prod
                      workingDirectory: $(Build.Repository.LocalPath)/packages/database
          - name: Deploy Web
            condition: ${{ eq(parameters.deployWeb, true) }}
            steps:
              - template: ../steps/azure_web_app_slot_swap.yml
                parameters:
                  appName: pins-app-consultees-web-$(ENVIRONMENT)
                  appResourceGroup: $(resourceGroup)
                  appStagingSlotName: staging
                  appTargetSlotName: production
              - template: ../steps/azure_web_app_verify_git_hash.yml
                parameters:
                  appName: Web
                  appUrl: https://pins-app-consultees-web-$(ENVIRONMENT).azurewebsites.net/health
                  buildCommit: $(resources.pipeline.build.sourceCommit)
                  auth_enabled: 'false'
                  env: $(ENVIRONMENT)
          - name: Deploy Orchestrator Functions
            steps:
              - download: build
                artifact: orchestrator-functions
                displayName: Download orchestrator-functions
              - template: ../steps/function_app_deploy.yml
                parameters:
                  appName: pins-func-consultees-orchestrator-$(ENVIRONMENT)
                  resourceGroup: $(resourceGroup)
                  workingDirectory: $(Pipeline.Workspace)/build/orchestrator-functions
