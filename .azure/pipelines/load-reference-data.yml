# Load the reference data files in an environment's blob storage - the consultee areas - into its
# database: each group's newest file, as the admin page's Load button does on Dev and Test. A group
# already loaded from its newest file is skipped, so it's safe to run again. Optionally empties a
# quarter's dataset first, or only that. Run by hand; the Promote reference data pipeline loads
# what it copies the same way. See packages/database/src/seed/load-reference-data.ts and
# kt-docs/data/data-model.md.
#
# A deployment to the environment, so Prod's approval check gates it. The pipeline's identity needs
# Storage Blob Data Contributor on the environment's consultees-data container - granted outside
# Terraform on Test, Training and Prod, not Dev (see kt-docs/data/data-model.md).
parameters:
  - name: environment
    displayName: Environment
    type: string
    default: Test
    values:
      - Test
      - Training
      - Prod
  - name: clearQuarter
    displayName: Empty this quarter's dataset first, as in 2026Q4 - blank for none
    type: string
    default: ' '
  - name: load
    displayName: Load the files (untick to only empty the quarter above)
    type: boolean
    default: true

pool: pins-odt-agent-pool

pr: none
trigger: none

# Runs wait their turn for an environment rather than an older one being cancelled - each is a
# deliberate data change. Deploy and Infrastructure CD use the same environments, so where they have
# an "Exclusive lock" check a load never overlaps a migration (see kt-docs/deployment.md)
lockBehavior: sequential

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: github.com_Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.30.0

variables:
  - group: pipeline_secrets

jobs:
  - deployment: Load
    displayName: Load ${{ parameters.environment }}'s reference data
    environment: ${{ parameters.environment }}
    # a load on Training's Basic tier can outlast the 60-minute default
    timeoutInMinutes: 240
    variables:
      - template: variables/environments/${{ lower(parameters.environment) }}.yml@templates
    strategy:
      runOnce:
        deploy:
          steps:
            - download: none
            - checkout: self
            - template: steps/node_script.yml@templates
              parameters:
                nodeVersion: 24
                script: |
                  source scripts/ci-use-latest-node.sh 24
                  npm ci --workspace=@pins/identify-consultees-database
            - template: steps/azure_auth.yml@templates
            - bash: |
                # Training's names are shorter (the Key Vault's had to be)
                if [[ $ENVIRONMENT == "training" ]]; then SHORT="train"; else SHORT="$ENVIRONMENT"; fi
                echo "##vso[task.setvariable variable=kvName;]pins-kv-consultees-$SHORT"
                echo "##vso[task.setvariable variable=blobStoreHost;]https://pinsstconsultees$SHORT.blob.core.windows.net/"
              displayName: Set Key Vault and blob storage names
              env:
                ENVIRONMENT: $(ENVIRONMENT)
            - template: steps/azure_get_secrets.yml@templates
              parameters:
                keyVaultName: $(kvName)
                secrets:
                  - name: consultees-sql-app-connection-string
                    variable: SQL_CONNECTION_STRING
            - template: steps/node_script.yml@templates
              parameters:
                nodeVersion: 24
                environmentVariables:
                  SQL_CONNECTION_STRING: $(SQL_CONNECTION_STRING)
                  BLOB_STORE_HOST: $(blobStoreHost)
                  BLOB_STORE_CONTAINER: consultees-data
                  # passed in, not written into the script, so what's typed is only ever an argument
                  CLEAR_QUARTER: ${{ parameters.clearQuarter }}
                script: npm run load-reference-data -- --clear="$CLEAR_QUARTER" ${{ iif(parameters.load, '', '--no-load') }}
                workingDirectory: $(Build.Repository.LocalPath)/packages/database
    workspace:
      clean: all
