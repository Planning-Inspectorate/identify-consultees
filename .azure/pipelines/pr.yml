trigger:
  branches:
    include:
      - main # run on main before build
      # trigger for merge queue branches
      - gh-readonly-queue/*

pr:
  branches:
    include:
      - '*'
  paths:
    exclude:
      - infrastructure

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.30.0

variables:
  # throwaway password for a SQL Server container that only exists for this CI job - not a secret
  mssqlSaPassword: 'CIDatabaseP@22word!'
  # unique per run: avoids name/port collisions if this pipeline ever runs on a shared/self-hosted
  # agent (rather than a fresh VM per job) with two builds running at once
  mssqlContainerName: 'ci-mssql-$(Build.BuildId)'

extends:
  template: stages/wrapper_ci.yml@templates
  parameters:
    gitFetchDepth: 0
    skipAzureAuth: true
    validationJobs:
      - name: Run Linting & Tests
        steps:
          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)" | package-lock.json
              path: $(npm_config_cache)
            displayName: Cache NPM
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'npm ci'
              # Pin exact Node used locally (.nvmrc) — ships npm 10.9.8; see AGENTS.md
              nodeVersion: 22.23.2
              script: npm ci
              environmentVariables:
                npm_config_cache: $(npm_config_cache)
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'npm run check-toolchain'
              nodeVersion: 22.23.2
              script: npm run check-toolchain
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'npm run db-generate'
              nodeVersion: 22.23.2
              # ensure @pins/identify-consultees-database/src/client is generated for tests that use it
              # this will also catch schema validation errors
              script: npm run db-generate
          - script: |
              set -e
              # -p 0:1433 - let Docker pick a free host port, discovered below, rather than a fixed
              # one that could collide with a concurrent run on a shared agent
              docker run -d --name "$(mssqlContainerName)" -p 0:1433 \
                -e 'ACCEPT_EULA=1' \
                -e "MSSQL_SA_PASSWORD=$(mssqlSaPassword)" \
                mcr.microsoft.com/mssql/server:2022-latest

              # docker port can list both an IPv4 (0.0.0.0:PORT) and IPv6 ([::]:PORT) line - grab the
              # trailing digits rather than splitting on ":", which breaks on the IPv6 form
              hostPort=$(docker port "$(mssqlContainerName)" 1433/tcp | head -n1 | grep -oE '[0-9]+$')
              if [ -z "$hostPort" ]; then
                echo "##vso[task.logissue type=error]Could not determine the host port Docker assigned to the SQL Server container"
                exit 1
              fi
              echo "SQL Server container $(mssqlContainerName) listening on host port $hostPort"
              echo "##vso[task.setvariable variable=testDbConnectionString]sqlserver://localhost:$hostPort;database=identify-consultees;user=sa;password=$(mssqlSaPassword);trustServerCertificate=true"

              ready=false
              for i in $(seq 1 30); do
                if docker exec "$(mssqlContainerName)" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$(mssqlSaPassword)" -C -Q 'SELECT 1' > /dev/null 2>&1; then
                  ready=true
                  break
                fi
                echo "Waiting for SQL Server to be ready... ($i/30)"
                sleep 2
              done
              if [ "$ready" != "true" ]; then
                echo "##vso[task.logissue type=error]SQL Server did not become ready in time"
                exit 1
              fi

              docker exec "$(mssqlContainerName)" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$(mssqlSaPassword)" -C -Q "IF DB_ID(N'identify-consultees') IS NULL CREATE DATABASE [identify-consultees]"
            displayName: 'Start SQL Server for tests'
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'npm run db-migrate-prod'
              # applies the real migrations (including the spatial index/check constraints) to a
              # throwaway database, proving the schema sets up correctly - not just that it compiles
              nodeVersion: 22.23.2
              script: npm run db-migrate-prod
              environmentVariables:
                SQL_CONNECTION_STRING_ADMIN: $(testDbConnectionString)
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'npm run commitlint'
              # only run commitlint on branches, not main
              condition: ne(variables['Build.SourceBranchName'], 'main')
              nodeVersion: 22.23.2
              script: npm run commitlint
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'npm run check-types'
              nodeVersion: 22.23.2
              script: npm run check-types
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'npm run lint'
              nodeVersion: 22.23.2
              script: npm run lint
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'npm run format-prettier-check'
              nodeVersion: 22.23.2
              script: npm run format-prettier-check
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'npm run playwright:install'
              nodeVersion: 22.23.2
              script: npm run playwright:install
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'npm run test-coverage'
              nodeVersion: 22.23.2
              script: npm run test-coverage
              # gives the database-backed tests (e.g. packages/database/src/geospatial/*.test.ts) a
              # real connection, so they run for real instead of skipping when no database is found
              environmentVariables:
                SQL_CONNECTION_STRING: $(testDbConnectionString)
          # run build for any web apps
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'npm run build'
              nodeVersion: 22.23.2
              workingDirectory: $(Build.Repository.LocalPath)/apps/manage
              script: npm run build
          - script: docker rm -f "$(mssqlContainerName)" || true
            displayName: 'Stop SQL Server container'
            condition: always()
      - name: Python Function Lint & Tests
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
            displayName: 'Use Python 3.12'
          - script: |
              set -e
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install pytest ruff
            workingDirectory: $(Build.Repository.LocalPath)/apps/function-python
            displayName: 'Install dependencies'
          - script: ruff check .
            workingDirectory: $(Build.Repository.LocalPath)/apps/function-python
            displayName: 'Lint'
          - script: pytest
            workingDirectory: $(Build.Repository.LocalPath)/apps/function-python
            # the database-backed tests skip gracefully with no SQL_CONNECTION_STRING/database here -
            # see packages/database's "Run Linting & Tests" job above for the pattern to extend this
            # with a real database, if these need to run for real in CI too
            displayName: 'Test'
