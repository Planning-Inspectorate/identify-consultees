trigger:
  branches:
    include:
      - main # run on main before build
      # trigger for merge queue branches
      - gh-readonly-queue/*

pr:
  branches:
    include:
      - '*'
  paths:
    exclude:
      - infrastructure

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: github.com_Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.30.0

extends:
  template: stages/wrapper_ci.yml@templates
  parameters:
    gitFetchDepth: 0
    skipAzureAuth: true
    # wrapper_ci.yml's own `variables:` block is built entirely from this parameter - a root-level
    # `variables:` key in this file (as this used to have) collides with that and fails schema
    # validation with "'variables' is already defined", before any step runs
    globalVariables:
      # throwaway password for a SQL Server container that only exists for this CI job - not a secret
      - name: mssqlSaPassword
        value: 'CIDatabaseP@22word!'
      # unique per run: avoids name/port collisions if this pipeline ever runs on a shared/self-hosted
      # agent (rather than a fresh VM per job) with two builds running at once
      - name: mssqlContainerName
        value: 'ci-mssql-$(Build.BuildId)'
      # the Python job runs on its own separate agent/workspace (Azure DevOps jobs don't share
      # machines), so it needs its own SQL Server container - a distinct name avoids any clash
      # with the Node job's container above if they ever land on the same self-hosted agent
      - name: pythonMssqlContainerName
        value: 'ci-mssql-python-$(Build.BuildId)'
      # and again for the e2e job - validation jobs run in parallel and could
      # theoretically land on the same self-hosted agent as the main job
      - name: e2eMssqlContainerName
        value: 'ci-mssql-e2e-$(Build.BuildId)'
    validationJobs:
      # validation jobs have no dependsOn, so they run in parallel on the pool -
      # this job covers the static checks and unit suites, 'Run E2E & Image Smoke
      # Tests' below covers Playwright and the Docker image smoke test, and the
      # Python job is unchanged
      - name: Run Linting & Tests
        steps:
          - script: |
              # the VMSS agent starts with an empty Docker image cache - kick the ~10s
              # pull off in the background so it overlaps the npm cache restore and
              # npm ci; scripts/ci-start-test-database.sh waits on the status file below
              tmp="$(Agent.TempDirectory)"
              touch "$tmp/mssql-pull.started"
              (docker pull mcr.microsoft.com/mssql/server:2022-latest > "$tmp/mssql-pull.log" 2>&1; echo $? > "$tmp/mssql-pull.status") < /dev/null > /dev/null 2>&1 &
            displayName: 'Prefetch SQL Server image (background)'
          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)" | package-lock.json
              path: $(npm_config_cache)
            displayName: Cache NPM
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'npm ci'
              # nodeVersion must be a whole number - the shared template types this parameter as
              # Number, so it can't take a full version. That's fine: we pin the major only
              # (matching .nvmrc and engines.node ^24 - see AGENTS.md) so CI always tracks the
              # latest Node 24.x. check-toolchain validates the engines range at runtime via
              # npm ci's own postinstall.
              nodeVersion: 24
              script: npm ci
              environmentVariables:
                npm_config_cache: $(npm_config_cache)
          # check-toolchain needs no standalone step: npm ci's postinstall already runs
          # it (postinstall = deps:patch-maplibre && check-toolchain), so the guard fires
          # on every install anyway
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'npm run db-generate'
              nodeVersion: 24
              # ensure @pins/identify-consultees-database/src/client is generated for tests that use it
              # this will also catch schema validation errors
              script: npm run db-generate
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'Bring up test database (background)'
              # ~30s of container start, readiness wait, migrate and seed - nothing
              # needs the database until the tests at the end of the job, so run it in
              # the background alongside the static checks; gated by 'Wait for test
              # database' there. Must come after db-generate: the seed imports the
              # generated Prisma client. The chain lives in
              # scripts/ci-start-test-database.sh so the wait step can re-run it
              # inline if this launcher was ever removed.
              nodeVersion: 24
              script: |
                tmp="$(Agent.TempDirectory)"
                touch "$tmp/mssql-db.started"
                (bash scripts/ci-start-test-database.sh "$tmp" > "$tmp/mssql-db.log" 2>&1; echo $? > "$tmp/mssql-db.status") < /dev/null > /dev/null 2>&1 &
                echo "Test database bring-up running in background - gated by 'Wait for test database' before the tests"
              environmentVariables:
                MSSQL_CONTAINER_NAME: $(mssqlContainerName)
                MSSQL_SA_PASSWORD: $(mssqlSaPassword)
          # all static checks in one step (each node_script invocation costs ~3s of
          # task/nvm overhead), run concurrently - the checks are independent, so the
          # step takes ~prettier rather than their ~35s serial sum. Each writes to its
          # own log so output stays attributable; commitlint only runs on branches,
          # not main.
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'Static checks (parallel)'
              nodeVersion: 24
              script: |
                set -u
                tmp="$(Agent.TempDirectory)/static-checks"
                mkdir -p "$tmp"

                run_check() {
                  name="$1"; shift
                  "$@" > "$tmp/$name.log" 2>&1
                  echo $? > "$tmp/$name.status"
                }

                if [ "$(Build.SourceBranchName)" != "main" ]; then
                  run_check commitlint npm run commitlint &
                fi
                run_check check-types npm run check-types &
                run_check lint-ts npm run lint-ts &
                run_check lint-css npm run lint-css &
                run_check prettier npm run format-prettier-check &
                wait

                failed=0
                for statusFile in "$tmp"/*.status; do
                  name=$(basename "$statusFile" .status)
                  echo "--- $name ---"
                  cat "$tmp/$name.log"
                  status=$(cat "$statusFile")
                  if [ "$status" != "0" ]; then
                    echo "##vso[task.logissue type=error]$name failed (exit $status) - see output above"
                    failed=1
                  fi
                done
                exit "$failed"
          # static assets (.static) are gitignored; Playwright a11y/render tests below need
          # compiled CSS/JS to exist - build first so a build failure is attributed to this
          # step, not buried inside the combined test-coverage script
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'npm run build'
              nodeVersion: 24
              workingDirectory: $(Build.Repository.LocalPath)/apps/manage
              script: npm run build
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'Wait for test database'
              # the backgrounded bring-up (container, migrate, seed) is only needed by
              # the tests below - surface its log/failure and publish the connection
              # string it wrote, so the test steps keep using $(testDbConnectionString)
              # exactly as the old inline steps set it
              nodeVersion: 24
              script: |
                set -e
                tmp="$(Agent.TempDirectory)"
                if [ ! -f "$tmp/mssql-db.started" ]; then
                  echo "No background database bring-up found - running it synchronously"
                  bash scripts/ci-start-test-database.sh "$tmp"
                else
                  for i in $(seq 1 150); do
                    [ -f "$tmp/mssql-db.status" ] && break
                    sleep 2
                  done
                  cat "$tmp/mssql-db.log" 2>/dev/null || true
                  if [ ! -f "$tmp/mssql-db.status" ]; then
                    echo "##vso[task.logissue type=error]Test database bring-up did not finish within the wait window"
                    exit 1
                  fi
                  status=$(cat "$tmp/mssql-db.status")
                  if [ "$status" != "0" ]; then
                    echo "##vso[task.logissue type=error]Test database bring-up failed - see log above"
                    exit "$status"
                  fi
                fi
                connString=$(cat "$tmp/mssql-conn.txt")
                echo "##vso[task.setvariable variable=testDbConnectionString]$connString"
                echo "Test database ready"
              environmentVariables:
                MSSQL_CONTAINER_NAME: $(mssqlContainerName)
                MSSQL_SA_PASSWORD: $(mssqlSaPassword)
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'Run unit tests (packages, frontend coverage)'
              # the packages/scripts node --test suite writes to the shared seeded
              # database; the manage unit coverage suite doesn't - but with no e2e
              # suite in this job there's nothing left to overlap, so run them
              # serially like npm run test-coverage does locally
              nodeVersion: 24
              script: node --test --experimental-test-coverage "packages/**/*.test.*" "scripts/**/*.test.*" && npm run test:coverage --workspace identify-consultees-manage
              # gives the database-backed tests (e.g. packages/database/src/geospatial/*.test.ts) a
              # real connection, so they run for real instead of skipping when no database is found
              environmentVariables:
                SQL_CONNECTION_STRING: $(testDbConnectionString)
          - script: docker rm -f "$(mssqlContainerName)" || true
            displayName: 'Stop SQL Server container'
            condition: always()
      - name: Run E2E & Image Smoke Tests
        steps:
          - script: |
              # the VMSS agent starts with an empty Docker image cache - kick the ~10s
              # pull off in the background so it overlaps the npm cache restore and
              # npm ci; scripts/ci-start-test-database.sh waits on the status file below
              tmp="$(Agent.TempDirectory)"
              touch "$tmp/mssql-pull.started"
              (docker pull mcr.microsoft.com/mssql/server:2022-latest > "$tmp/mssql-pull.log" 2>&1; echo $? > "$tmp/mssql-pull.status") < /dev/null > /dev/null 2>&1 &
            displayName: 'Prefetch SQL Server image (background)'
          - script: |
              set -e
              # --load exports the built image into the local daemon for the smoke
              # `docker run` later (buildx only does that implicitly when the docker
              # driver happens to be the default builder). The image is self-contained -
              # the Dockerfile runs its own npm ci/build/db-generate - so the build can
              # start this early: it overlaps npm ci and db setup. Gated by 'Wait for
              # manage Docker build' before the smoke test.
              tmp="$(Agent.TempDirectory)"
              touch "$tmp/docker-build.started"
              (docker buildx build --load -f apps/manage/Dockerfile -t identify-consultees-manage-ci-smoke \
                --build-arg GIT_SHA=$(Build.SourceVersion) . > "$tmp/docker-build.log" 2>&1; echo $? > "$tmp/docker-build.status") < /dev/null > /dev/null 2>&1 &
              echo "Docker image build running in background"
            workingDirectory: $(Build.Repository.LocalPath)
            displayName: 'Start manage Docker image build (background)'
          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)" | package-lock.json
              path: $(npm_config_cache)
            displayName: Cache NPM
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'npm ci'
              # same pin-by-major rationale as the main job's npm ci step
              nodeVersion: 24
              script: npm ci
              environmentVariables:
                npm_config_cache: $(npm_config_cache)
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'Install Playwright browsers (background)'
              # apt-lock patience (unattended-upgrades on a cold agent), apt no-ops and
              # ~500MB of browser downloads - nothing needs the browsers until the e2e
              # tests at the end of the job, so run it in the background and gate on
              # the status file there instead
              nodeVersion: 24
              script: |
                tmp="$(Agent.TempDirectory)"
                touch "$tmp/playwright-install.started"
                (npm run playwright:install > "$tmp/playwright-install.log" 2>&1; echo $? > "$tmp/playwright-install.status") < /dev/null > /dev/null 2>&1 &
                echo "Playwright browser install running in background - gated by 'Wait for Playwright install' before the tests"
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'npm run db-generate'
              nodeVersion: 24
              # ensure @pins/identify-consultees-database/src/client is generated - the
              # e2e web server runs the app from source via node --experimental-strip-types
              script: npm run db-generate
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'Bring up test database (background)'
              # same backgrounded bring-up as the main job - this job has less
              # foreground work for it to hide behind, so some of the ~30s will still
              # be waited on by 'Wait for test database'
              nodeVersion: 24
              script: |
                tmp="$(Agent.TempDirectory)"
                touch "$tmp/mssql-db.started"
                (bash scripts/ci-start-test-database.sh "$tmp" > "$tmp/mssql-db.log" 2>&1; echo $? > "$tmp/mssql-db.status") < /dev/null > /dev/null 2>&1 &
                echo "Test database bring-up running in background - gated by 'Wait for test database' before the tests"
              environmentVariables:
                # own container name - parallel validation jobs could land on the same
                # self-hosted agent, and identical container names would collide
                MSSQL_CONTAINER_NAME: $(e2eMssqlContainerName)
                MSSQL_SA_PASSWORD: $(mssqlSaPassword)
          # static assets (.static) are gitignored; Playwright a11y/render tests need
          # compiled CSS/JS to exist - build first so a build failure is attributed to
          # this step, not buried inside the e2e run
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'npm run build'
              nodeVersion: 24
              workingDirectory: $(Build.Repository.LocalPath)/apps/manage
              script: npm run build
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'Wait for Playwright install'
              # browsers are only needed by the e2e tests - this waits on the
              # background install kicked off right after npm ci and surfaces its
              # log/failure; falls back to a synchronous install if the launcher step
              # never ran (e.g. cherry-picked away)
              nodeVersion: 24
              # 20-minute window: on a cold agent unattended-upgrades can hold the dpkg
              # lock for several minutes (apt is configured to block on it for up to
              # 10, see apps/manage/scripts/playwright-install.mjs) and the browser
              # downloads then run after it
              script: |
                tmp="$(Agent.TempDirectory)"
                if [ ! -f "$tmp/playwright-install.started" ]; then
                  echo "No background Playwright install found - installing synchronously"
                  exec npm run playwright:install
                fi
                for i in $(seq 1 600); do
                  [ -f "$tmp/playwright-install.status" ] && break
                  sleep 2
                done
                cat "$tmp/playwright-install.log" 2>/dev/null || true
                if [ ! -f "$tmp/playwright-install.status" ]; then
                  echo "##vso[task.logissue type=error]Playwright install did not finish within the wait window"
                  exit 1
                fi
                status=$(cat "$tmp/playwright-install.status")
                if [ "$status" != "0" ]; then
                  echo "##vso[task.logissue type=error]Playwright install failed - see log above"
                  exit "$status"
                fi
                echo "Playwright browsers ready"
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'Wait for test database'
              # publishes the connection string the backgrounded bring-up wrote, so
              # the e2e run and the docker smoke test get $(testDbConnectionString)
              nodeVersion: 24
              script: |
                set -e
                tmp="$(Agent.TempDirectory)"
                if [ ! -f "$tmp/mssql-db.started" ]; then
                  echo "No background database bring-up found - running it synchronously"
                  bash scripts/ci-start-test-database.sh "$tmp"
                else
                  for i in $(seq 1 150); do
                    [ -f "$tmp/mssql-db.status" ] && break
                    sleep 2
                  done
                  cat "$tmp/mssql-db.log" 2>/dev/null || true
                  if [ ! -f "$tmp/mssql-db.status" ]; then
                    echo "##vso[task.logissue type=error]Test database bring-up did not finish within the wait window"
                    exit 1
                  fi
                  status=$(cat "$tmp/mssql-db.status")
                  if [ "$status" != "0" ]; then
                    echo "##vso[task.logissue type=error]Test database bring-up failed - see log above"
                    exit "$status"
                  fi
                fi
                connString=$(cat "$tmp/mssql-conn.txt")
                echo "##vso[task.setvariable variable=testDbConnectionString]$connString"
                echo "Test database ready"
              environmentVariables:
                MSSQL_CONTAINER_NAME: $(e2eMssqlContainerName)
                MSSQL_SA_PASSWORD: $(mssqlSaPassword)
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'npm run test:e2e:run'
              # test:e2e:run skips the rebuild inside test:e2e - this job already
              # built .static above
              nodeVersion: 24
              script: npm run test:e2e:run --workspace identify-consultees-manage
              environmentVariables:
                SQL_CONNECTION_STRING: $(testDbConnectionString)
          - script: |
              set -e
              tmp="$(Agent.TempDirectory)"
              if [ ! -f "$tmp/docker-build.started" ]; then
                # launcher step wasn't run (e.g. cherry-picked away) - build inline
                docker buildx build --load -f apps/manage/Dockerfile -t identify-consultees-manage-ci-smoke \
                  --build-arg GIT_SHA=$(Build.SourceVersion) .
                exit 0
              fi
              for i in $(seq 1 150); do
                [ -f "$tmp/docker-build.status" ] && break
                sleep 2
              done
              cat "$tmp/docker-build.log" 2>/dev/null || true
              if [ ! -f "$tmp/docker-build.status" ]; then
                echo "##vso[task.logissue type=error]Docker image build did not finish within the wait window"
                exit 1
              fi
              status=$(cat "$tmp/docker-build.status")
              if [ "$status" != "0" ]; then
                echo "##vso[task.logissue type=error]Docker image build failed - see log above"
                exit "$status"
              fi
              echo "manage Docker image built"
            workingDirectory: $(Build.Repository.LocalPath)
            displayName: 'Wait for manage Docker build'
          - script: |
              set -e
              # boots the *actual* deployed artifact (this Docker image, this entrypoint) against a
              # real database, not just the source tree node --test already runs. Only the Docker
              # image is ever built from a trimmed copy of the repo (see apps/manage/Dockerfile) - a
              # real incident got past every other check here because something the running app
              # needed at import time wasn't actually present in that trimmed copy, and nothing
              # short of booting the real image would have caught it.
              docker run -d --name manage-ci-smoke --network host \
                -e NODE_ENV=production \
                -e PORT=8099 \
                -e APP_HOSTNAME=localhost \
                -e SQL_CONNECTION_STRING="$(testDbConnectionString)" \
                -e SESSION_SECRET="ci-smoke-test-session-secret-at-least-32-characters" \
                -e AUTH_CLIENT_ID=ci-smoke-test \
                -e AUTH_CLIENT_SECRET=ci-smoke-test \
                -e AUTH_TENANT_ID=ci-smoke-test \
                -e AUTH_GROUP_APPLICATION_ACCESS=ci-smoke-test \
                identify-consultees-manage-ci-smoke

              ready=false
              for i in $(seq 1 15); do
                if response=$(curl -sf http://localhost:8099/health 2>/dev/null) && echo "$response" | grep -q '"database":"OK"'; then
                  echo "$response"
                  ready=true
                  break
                fi
                echo "Waiting for the built image to become healthy... ($i/15)"
                sleep 2
              done

              echo "--- container logs ---"
              docker logs manage-ci-smoke || true

              if [ "$ready" != "true" ]; then
                echo "##vso[task.logissue type=error]The built manage Docker image did not become healthy - see logs above"
                exit 1
              fi
            displayName: 'Smoke-test the built Docker image'
          - script: |
              docker rm -f manage-ci-smoke || true
              docker rm -f "$(e2eMssqlContainerName)" || true
            displayName: 'Clean up containers'
            condition: always()
      - name: Python Function Lint & Tests
        steps:
          # UsePythonVersion@0 downloads a prebuilt Python from GitHub's actions/python-versions
          # releases (built for Ubuntu 22.04) and install it into Agent.ToolsDirectory - on this
          # pool (pins-odt-agent-pool, a self-hosted agent, not a Microsoft-hosted VM) that build's
          # shared libraries don't match the agent's actual image, failing with "libpython3.12.so.1.0:
          # cannot open shared object file". Using the agent's own system python3 instead sidesteps
          # that download entirely - this job only lints/tests, it doesn't need an exact Python
          # version match with the deployed Function App runtime (pinned via Terraform separately)
          - script: python3 --version
            displayName: 'Check Python version'
          - script: |
              set -e
              python3 -m pip install --upgrade pip
              python3 -m pip install -r requirements.txt
              python3 -m pip install pytest ruff
            workingDirectory: $(Build.Repository.LocalPath)/apps/function-python
            displayName: 'Install dependencies'
          - script: python3 -m ruff check .
            workingDirectory: $(Build.Repository.LocalPath)/apps/function-python
            displayName: 'Lint'
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'npm ci'
              # needed for the migrate step below (npx prisma) - without a local install, npx
              # fetches prisma fresh from the registry instead of the project's pinned version
              nodeVersion: 24
              script: npm ci --workspace=@pins/identify-consultees-database
          - script: |
              set -e
              docker run -d --name "$(pythonMssqlContainerName)" -p 0:1433 \
                -e 'ACCEPT_EULA=1' \
                -e "MSSQL_SA_PASSWORD=$(mssqlSaPassword)" \
                mcr.microsoft.com/mssql/server:2022-latest

              hostPort=$(docker port "$(pythonMssqlContainerName)" 1433/tcp | head -n1 | grep -oE '[0-9]+$')
              if [ -z "$hostPort" ]; then
                echo "##vso[task.logissue type=error]Could not determine the host port Docker assigned to the SQL Server container"
                exit 1
              fi
              echo "SQL Server container $(pythonMssqlContainerName) listening on host port $hostPort"
              echo "##vso[task.setvariable variable=pythonTestDbConnectionString]sqlserver://localhost:$hostPort;database=identify-consultees;user=sa;password=$(mssqlSaPassword);trustServerCertificate=true"

              ready=false
              for i in $(seq 1 30); do
                if docker exec "$(pythonMssqlContainerName)" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$(mssqlSaPassword)" -C -Q 'SELECT 1' > /dev/null 2>&1; then
                  ready=true
                  break
                fi
                echo "Waiting for SQL Server to be ready... ($i/30)"
                sleep 2
              done
              if [ "$ready" != "true" ]; then
                echo "##vso[task.logissue type=error]SQL Server did not become ready in time"
                exit 1
              fi

              docker exec "$(pythonMssqlContainerName)" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$(mssqlSaPassword)" -C -Q "IF DB_ID(N'identify-consultees') IS NULL CREATE DATABASE [identify-consultees]"
            displayName: 'Start SQL Server for tests'
          - template: ../steps/node_script.yml
            parameters:
              displayName: 'npm run db-migrate-prod'
              # schema only, no seed data - the Python tests only assert on shape (a list, JSON
              # serialisable, limit respected), not on specific rows
              nodeVersion: 24
              script: npm run db-migrate-prod
              environmentVariables:
                SQL_CONNECTION_STRING_ADMIN: $(pythonTestDbConnectionString)
          - script: python3 -m pytest
            workingDirectory: $(Build.Repository.LocalPath)/apps/function-python
            displayName: 'Test'
            env:
              # setup_database/db.py reads SQL_CONNECTION_STRING (not _ADMIN - that's only used to
              # apply migrations above)
              SQL_CONNECTION_STRING: $(pythonTestDbConnectionString)
          - script: docker rm -f "$(pythonMssqlContainerName)" || true
            displayName: 'Stop SQL Server container'
            condition: always()
