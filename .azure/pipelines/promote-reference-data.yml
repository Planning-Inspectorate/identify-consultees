# Copy a quarter's reference data files - the consultee areas - one environment along: Test to
# Training, or Training to Prod. The files the source loaded for its dataset in use are exported
# with what each loaded, then copied to the target's blob storage, ready to load on its admin page
# (/admin/import-reference-data). Nothing is loaded here. Case boundaries aren't copied: each
# environment imports its own from its CBOS. Started by hand, or from the target's admin page
# (/admin/upload-to-blob, its Copy section). See packages/database/src/seed/promote-reference-data.ts
# and kt-docs/data/data-model.md.
#
# Each job signs in to its own environment only, and the files pass between them as a pipeline
# artifact. The Copy job is a deployment to the target's environment, so Prod's approval check
# gates it. The pipeline's identity needs Storage Blob Data Contributor on each environment's
# consultees-data container - granted outside Terraform (see kt-docs/data/data-model.md).
parameters:
  - name: quarter
    displayName: Quarter to copy, as in 2026Q4 - blank for the source environment's dataset in use, which it must be
    type: string
    default: ' '
  - name: route
    displayName: From and to
    type: string
    default: Test to Training
    values:
      - Test to Training
      - Training to Prod

pool: pins-odt-agent-pool

pr: none
trigger: none

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: github.com_Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.30.0

variables:
  - group: pipeline_secrets
  - name: exportDir
    value: $(Pipeline.Workspace)/reference-data
  - ${{ if eq(parameters.route, 'Test to Training') }}:
      - name: sourceEnvironment
        value: Test
      - name: targetEnvironment
        value: Training
  - ${{ if eq(parameters.route, 'Training to Prod') }}:
      - name: sourceEnvironment
        value: Training
      - name: targetEnvironment
        value: Prod

jobs:
  - deployment: Export
    displayName: Export from ${{ variables.sourceEnvironment }}
    environment: ${{ variables.sourceEnvironment }}
    variables:
      - template: variables/environments/${{ lower(variables.sourceEnvironment) }}.yml@templates
    strategy:
      runOnce:
        deploy:
          steps:
            - download: none
            - checkout: self
            - template: steps/node_script.yml@templates
              parameters:
                nodeVersion: 24
                script: |
                  source scripts/ci-use-latest-node.sh 24
                  npm ci --workspace=@pins/identify-consultees-database
            - template: steps/azure_auth.yml@templates
            - bash: |
                # Training's names are shorter (the Key Vault's had to be)
                if [[ $ENVIRONMENT == "training" ]]; then SHORT="train"; else SHORT="$ENVIRONMENT"; fi
                echo "##vso[task.setvariable variable=kvName;]pins-kv-consultees-$SHORT"
                echo "##vso[task.setvariable variable=blobStoreHost;]https://pinsstconsultees$SHORT.blob.core.windows.net/"
              displayName: Set Key Vault and blob storage names
              env:
                ENVIRONMENT: $(ENVIRONMENT)
            - template: steps/azure_get_secrets.yml@templates
              parameters:
                keyVaultName: $(kvName)
                secrets:
                  - name: consultees-sql-app-connection-string
                    variable: SQL_CONNECTION_STRING
            - template: steps/node_script.yml@templates
              parameters:
                nodeVersion: 24
                environmentVariables:
                  SQL_CONNECTION_STRING: $(SQL_CONNECTION_STRING)
                  BLOB_STORE_HOST: $(blobStoreHost)
                  BLOB_STORE_CONTAINER: consultees-data
                script: |
                  set -e
                  mkdir -p "$(exportDir)"
                  npm run promote-reference-data -- export --quarter=${{ trim(parameters.quarter) }} --dir="$(exportDir)"
                workingDirectory: $(Build.Repository.LocalPath)/packages/database
            - task: PublishPipelineArtifact@1
              displayName: Publish the exported files
              inputs:
                targetPath: $(exportDir)
                artifact: reference-data
    workspace:
      clean: all

  - deployment: Copy
    displayName: Copy into ${{ variables.targetEnvironment }}'s blob storage
    dependsOn: Export
    environment: ${{ variables.targetEnvironment }}
    variables:
      - template: variables/environments/${{ lower(variables.targetEnvironment) }}.yml@templates
    strategy:
      runOnce:
        deploy:
          steps:
            - download: current
              artifact: reference-data
            - checkout: self
            - template: steps/node_script.yml@templates
              parameters:
                nodeVersion: 24
                script: |
                  source scripts/ci-use-latest-node.sh 24
                  npm ci --workspace=@pins/identify-consultees-database
            - template: steps/azure_auth.yml@templates
            - bash: |
                if [[ $ENVIRONMENT == "training" ]]; then SHORT="train"; else SHORT="$ENVIRONMENT"; fi
                echo "##vso[task.setvariable variable=blobStoreHost;]https://pinsstconsultees$SHORT.blob.core.windows.net/"
              displayName: Set the blob storage name
              env:
                ENVIRONMENT: $(ENVIRONMENT)
            # only blob storage - copying loads nothing, so it needs no database
            - template: steps/node_script.yml@templates
              parameters:
                nodeVersion: 24
                environmentVariables:
                  BLOB_STORE_HOST: $(blobStoreHost)
                  BLOB_STORE_CONTAINER: consultees-data
                script: npm run promote-reference-data -- copy --dir="$(Pipeline.Workspace)/reference-data"
                workingDirectory: $(Build.Repository.LocalPath)/packages/database
    workspace:
      clean: all
