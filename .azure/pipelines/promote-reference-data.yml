# Copy the reference data files - the consultee areas - one environment along: Test to Training, or
# Training to Prod. Each group's newest file in the source's blob storage is copied to the target's,
# then - unless "Load" is unticked - loaded into the target's database, as the Load reference data
# pipeline does (load-reference-data.yml). Case boundaries aren't copied: each environment imports
# its own from its CBOS. See packages/database/src/seed/promote-reference-data.ts and
# kt-docs/data/data-model.md.
#
# Each job signs in to its own environment only, and the files pass between them as a pipeline
# artifact. The Copy job is a deployment to the target's environment, so Prod's approval check
# gates it. The pipeline's identity needs Storage Blob Data Contributor on each environment's
# consultees-data container - granted outside Terraform (see kt-docs/data/data-model.md).
parameters:
  - name: route
    displayName: From and to
    type: string
    default: Test to Training
    values:
      - Test to Training
      - Training to Prod
  - name: load
    displayName: Load the files into the target's database once they're copied
    type: boolean
    default: true

pool: pins-odt-agent-pool

pr: none
trigger: none

# Runs wait their turn for an environment rather than an older one being cancelled - each is a
# deliberate data change. Deploy and Infrastructure CD use the same environments, so where they have
# an "Exclusive lock" check a load never overlaps a migration (see kt-docs/deployment.md)
lockBehavior: sequential

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: github.com_Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.30.0

variables:
  - group: pipeline_secrets
  - name: exportDir
    value: $(Pipeline.Workspace)/reference-data
  - ${{ if eq(parameters.route, 'Test to Training') }}:
      - name: sourceEnvironment
        value: Test
      - name: targetEnvironment
        value: Training
  - ${{ if eq(parameters.route, 'Training to Prod') }}:
      - name: sourceEnvironment
        value: Training
      - name: targetEnvironment
        value: Prod

jobs:
  - deployment: Export
    displayName: Export from ${{ variables.sourceEnvironment }}
    environment: ${{ variables.sourceEnvironment }}
    variables:
      - template: variables/environments/${{ lower(variables.sourceEnvironment) }}.yml@templates
    strategy:
      runOnce:
        deploy:
          steps:
            - download: none
            - checkout: self
            - template: steps/node_script.yml@templates
              parameters:
                nodeVersion: 24
                script: |
                  source scripts/ci-use-latest-node.sh 24
                  npm ci --workspace=@pins/identify-consultees-database
            - template: steps/azure_auth.yml@templates
            - bash: |
                # Training's names are shorter
                if [[ $ENVIRONMENT == "training" ]]; then SHORT="train"; else SHORT="$ENVIRONMENT"; fi
                echo "##vso[task.setvariable variable=blobStoreHost;]https://pinsstconsultees$SHORT.blob.core.windows.net/"
              displayName: Set the blob storage name
              env:
                ENVIRONMENT: $(ENVIRONMENT)
            # only blob storage - the source's database isn't read
            - template: steps/node_script.yml@templates
              parameters:
                nodeVersion: 24
                environmentVariables:
                  BLOB_STORE_HOST: $(blobStoreHost)
                  BLOB_STORE_CONTAINER: consultees-data
                script: |
                  set -e
                  mkdir -p "$(exportDir)"
                  npm run promote-reference-data -- export --dir="$(exportDir)"
                workingDirectory: $(Build.Repository.LocalPath)/packages/database
            - task: PublishPipelineArtifact@1
              displayName: Publish the exported files
              inputs:
                targetPath: $(exportDir)
                artifact: reference-data
    workspace:
      clean: all

  - deployment: Copy
    displayName: Copy into ${{ variables.targetEnvironment }}${{ iif(parameters.load, ' and load', '') }}
    dependsOn: Export
    environment: ${{ variables.targetEnvironment }}
    # a load on a small tier (Training's S1) can outlast the 60-minute default
    timeoutInMinutes: 240
    variables:
      - template: variables/environments/${{ lower(variables.targetEnvironment) }}.yml@templates
    strategy:
      runOnce:
        deploy:
          steps:
            - download: current
              artifact: reference-data
            - checkout: self
            - template: steps/node_script.yml@templates
              parameters:
                nodeVersion: 24
                script: |
                  source scripts/ci-use-latest-node.sh 24
                  npm ci --workspace=@pins/identify-consultees-database
            - template: steps/azure_auth.yml@templates
            - bash: |
                # Training's names are shorter (the Key Vault's had to be)
                if [[ $ENVIRONMENT == "training" ]]; then SHORT="train"; else SHORT="$ENVIRONMENT"; fi
                echo "##vso[task.setvariable variable=kvName;]pins-kv-consultees-$SHORT"
                echo "##vso[task.setvariable variable=blobStoreHost;]https://pinsstconsultees$SHORT.blob.core.windows.net/"
              displayName: Set Key Vault and blob storage names
              env:
                ENVIRONMENT: $(ENVIRONMENT)
            - template: steps/node_script.yml@templates
              parameters:
                nodeVersion: 24
                environmentVariables:
                  BLOB_STORE_HOST: $(blobStoreHost)
                  BLOB_STORE_CONTAINER: consultees-data
                script: npm run promote-reference-data -- copy --dir="$(Pipeline.Workspace)/reference-data"
                workingDirectory: $(Build.Repository.LocalPath)/packages/database
            # then load them, as the Load reference data pipeline does: each group's newest file,
            # skipping one already loaded
            - ${{ if eq(parameters.load, true) }}:
                - template: steps/azure_get_secrets.yml@templates
                  parameters:
                    keyVaultName: $(kvName)
                    secrets:
                      - name: consultees-sql-app-connection-string
                        variable: SQL_CONNECTION_STRING
                - template: steps/node_script.yml@templates
                  parameters:
                    nodeVersion: 24
                    environmentVariables:
                      SQL_CONNECTION_STRING: $(SQL_CONNECTION_STRING)
                      BLOB_STORE_HOST: $(blobStoreHost)
                      BLOB_STORE_CONTAINER: consultees-data
                    script: npm run load-reference-data
                    workingDirectory: $(Build.Repository.LocalPath)/packages/database
    workspace:
      clean: all
