# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/' # Location of package manifests
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      prisma: # group prisma library (dev-dep) and client (prod dep) updates together
        patterns:
          - 'prisma'
          - '@prisma/*'
      deps: # all non-dev dependencies
        patterns:
          - '*'
        dependency-type: 'production'
      devDeps: # all dev dependencies
        patterns:
          - '*'
        dependency-type: 'development'
  - package-ecosystem: 'terraform'
    directory: '/infrastructure' # Location of package manifests
    schedule:
      interval: 'weekly'
      day: 'tuesday' # day after npm updates
    cooldown:
      default-days: 7
  - package-ecosystem: 'pip'
    directory: '/apps/function-python' # Location of requirements.txt
    schedule:
      interval: 'weekly'
      day: 'tuesday' # day after npm updates
    cooldown:
      default-days: 7
    groups:
      python: # pinned requirements move together - test_requirements.py enforces ==
        patterns:
          - '*'
  # no 'docker' ecosystem: the Dockerfile's FROM is the floating major-only tag
  # node:24-alpine (see apps/manage/Dockerfile and AGENTS.md's toolchain rules), so
  # there is no version for Dependabot to bump
