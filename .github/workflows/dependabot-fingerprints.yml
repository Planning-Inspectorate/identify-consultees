# Regenerates the committed asset fingerprints on Dependabot branches.
#
# `npm run check-fingerprints` in the Azure PR pipeline fails whenever a
# dependency bump changes the built bytes of a fingerprinted asset (vendored
# @defra/interactive-map bundles, govuk-frontend, accessible-autocomplete, …)
# because the fallback literals in apps/manage/src/util/config-middleware.ts no
# longer match a fresh build. Dependabot cannot run that build itself, so this
# workflow does it and pushes the regenerated file back onto the PR branch. The
# push re-triggers the Azure PR build, which then validates the updated commit.
#
# This runs on `push` rather than `pull_request`: pull_request events from
# Dependabot get a read-only GITHUB_TOKEN, while push events on the branch keep
# the write permission needed to commit the regenerated file. The commit pushed
# here does not re-trigger this workflow (it exits cleanly with no diff anyway),
# but it does re-trigger the Azure Pipelines PR validation.

name: Dependabot asset fingerprints

on:
  push:
    branches:
      - 'dependabot/**'

permissions:
  contents: write

concurrency:
  group: dependabot-fingerprints-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-fingerprints:
    name: Regenerate asset fingerprints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # the build rewrites the stale literals in config-middleware.ts in place
      - run: npm run update-fingerprints
        working-directory: apps/manage

      - name: Commit and push regenerated fingerprints
        run: |
          if git diff --quiet -- apps/manage/src/util/config-middleware.ts; then
            echo 'Asset fingerprints already current — nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/manage/src/util/config-middleware.ts
          git commit -m 'chore(manage): regenerate asset fingerprints'
          git push
