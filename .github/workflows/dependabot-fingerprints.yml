# Previously rewrote hashed fallbacks in config-middleware.ts on Dependabot
# branches. Fingerprinted names now live only in asset-manifest.json (written
# by `npm run build` and resolved at boot), so there is nothing for Dependabot
# to commit. This workflow is retained as a no-op guard so old branch filters
# and pipeline docs that name it do not 404; it exits after confirming that.

name: Dependabot asset fingerprints

on:
  push:
    branches:
      - 'dependabot/**'

permissions:
  contents: read

concurrency:
  group: dependabot-fingerprints-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-fingerprints:
    name: Asset fingerprints (manifest-only)
    runs-on: ubuntu-latest
    steps:
      - name: No committed fingerprint literals
        run: |
          echo 'Fingerprinted asset names resolve from asset-manifest.json at boot.'
          echo 'config-middleware.ts holds logical fallbacks only — nothing to regenerate on Dependabot PRs.'
