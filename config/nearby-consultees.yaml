# Nearby consultees: how far around a project's site the maps show consultees the ruleset didn't
# identify. They're context, not report content - the report pages list only consultees a ruleset
# condition identified - and the maps draw them faintly, under the identified ones.
#
# Read when the app starts (apps/manage/src/app/nearby-consultees.ts), which refuses to start if a
# value here is invalid - so a change is checked by `npm run check-config` and takes effect on the next deploy.
#
#   defaultRadiusKm  - the distance for any category not listed below. More than 0.
#   categories       - a distance in km for each consultee category. 0 means never show that
#                      category as nearby. Names must match consultee_area.consulteeCategory exactly
#                      (see kt-docs/data/reference-data.md).
#   nsipRadiusKm     - how far from the site another case's boundary can be for it to be a Nearby
#                      NSIP - in the report, like a consultee a ruleset identified. Each case counts
#                      once, by its most recently received shapefile. 0 means none are looked for;
#                      10 if not set.
#
# Railways is never searched as nearby, whatever is set here: its data is one national shape per
# line type, which is near almost every site and slows the search (see kt-docs/data/screening-issues.md).
#
# Larger distances mean more consultees on the maps and a slower search: the search reaches out to
# the largest distance here, for every category.

version: 1

defaultRadiusKm: 20

nsipRadiusKm: 35

categories:
  # local government
  'Parish, town and community councils': 20
  District councils (lower-tier authorities): 20
  Unitary authorities: 20
  County councils (upper-tier authorities): 20
  Greater London Authority: 20
  Corporate joint committees (Wales): 20
  # health
  Hospitals operated by NHS trusts and NHS foundation trusts (England): 20
  Integrated Care Boards (England): 20
  Local health boards (Wales): 20
  Ambulance trusts: 20
  # emergency services and resilience
  Police and crime commissioners: 20
  Fire and rescue authorities: 20
  Local resilience forums (Wales): 20
  # landscape and water
  National Parks UK (England): 20
  National Parks UK (Wales): 20
  National Landscapes - areas of outstanding natural beauty (England): 20
  National Landscapes - areas of outstanding natural beauty (Wales): 20
  Internal drainage boards (England): 20
  Internal drainage boards (Wales): 20
  # transport
  Dock and harbour authorities: 20
  Integrated transport authorities: 20
  Passenger transport executives: 20
  # energy
  Electricity generators with compulsory purchase order powers: 20
  Office for Nuclear Regulation sites: 20
  Electricity distributors with compulsory purchase order powers: 20
  Electricity interconnectors with compulsory purchase order powers: 20
  Offshore wind export cables and sites: 20
