# Reference data: which consultee category each of the reference data's source datasets loads
# as. Read when the app starts, and by every import (packages/database/src/seed/reference-data.ts),
# which refuses to start or import if a value here is invalid - so a change is checked by
# `npm run check-config` and takes effect on the next deploy.
#
# Each feature's id names its dataset: health_AMB_EW_00001 is from AMB_EW, the ambulance trusts
# of England and Wales. The file's own consultee_category is a broad group (Health, Transport,
# Other...), so the import gives each feature its dataset's category instead - the names the
# rulesets (rulesets/rulesets.yaml), the report (report.yaml) and the maps (nearby-consultees.yaml)
# use. The group is kept too, in consultee_area.consulteeGroup.
#
#   datasets - each dataset code (the id's capitals and area: AMB_EW) and its consultee category.
#              A file holding a dataset not listed here isn't imported - nothing is changed - and
#              the import names it, so a new dataset can't load as a category nothing matches.
#              A dataset holding more than one kind of consultee can instead give its category
#              under `category`, and under `subcategories` the category each of its
#              consultee_subcategory values loads as instead - compared ignoring case and repeated
#              spaces. A subcategory not listed loads as the dataset's category.
#
#   groups   - the five groups the reference data is uploaded and loaded in - the report's tabs. The
#              pipeline writes a file per group (YYYYMMDD_<group>.geojson, e.g.
#              20261020_public_bodies.geojson), the admin pages upload and load each on its own,
#              and loading a group replaces only its categories' rows. Every category a dataset or
#              subcategory above loads as must be in exactly one group; a group can also list
#              categories with no data yet. A file holding a category from another group isn't
#              loaded, and the page names it.
#
# A feature whose id has no dataset code (parish_council_E04000001, railway_RAILWAY_0001) keeps
# the category the file gives it.

version: 1

datasets:
  # local authorities
  PAR_EW: Parish, town and community councils
  LTA_EW: District councils (lower-tier authorities)
  UTA_EW: Unitary authorities
  UPT_EW: County councils (upper-tier authorities)
  GLA_EW: Greater London Authority
  # administrative boundaries
  FRS_EW: Fire and rescue authorities
  POL_EW: Police and crime commissioners
  NPK_EN: National Parks UK (England)
  NPK_WA: National Parks UK (Wales)
  # the earlier combined England & Wales parks file (NPK_EW) isn't listed: its features can't be
  # labelled by country, so only the per-country files load
  CJC_EW: Corporate joint committees (Wales)
  # health
  AMB_EW: Ambulance trusts
  HSP_EN: Hospitals operated by NHS trusts and NHS foundation trusts (England)
  ICB_EW: Integrated Care Boards (England)
  LHB_WA: Local health boards (Wales)
  # landscape and water
  NLA_EN: National Landscapes - areas of outstanding natural beauty (England)
  NLA_WA: National Landscapes - areas of outstanding natural beauty (Wales)
  IDB_EN: Internal drainage boards (England)
  IDB_WA: Internal drainage boards (Wales)
  # emergency planning
  LRF_EW: Local resilience forums (Wales)
  # transport
  RAIL_EW: Railways
  CAN_EW: Canal or inland navigation authorities
  DKH_WE: Dock and harbour authorities
  ITA_EW: Integrated transport authorities
  PTE_EW: Passenger transport executives
  # energy
  ELG_EW: Electricity generators with compulsory purchase order powers
  DNO_EW: Electricity distributors with compulsory purchase order powers
  ICN_EW: Electricity interconnectors with compulsory purchase order powers
  # sites and their export cables, which the report tells apart by subcategory - one layer
  OWF_EW:
    category: Offshore wind export cables and sites
    subcategories:
      Offshore Wind Export Cables: Offshore wind export cables and sites
  ONR_EW: Office for Nuclear Regulation sites
  # other - safeguarding and reporting areas
  MSG_EW: Ministry of Defence safeguarding areas
  MLF_EW: Ministry of Defence low flying areas
  CMA_EW: Mining remediation authority
  CBA_EN: Cheshire brine subsidence district
  # earlier exports' codes for the same datasets
  OWS_NA: Offshore wind export cables and sites
  ONR_NA: Office for Nuclear Regulation sites

groups:
  Administrative boundaries:
    - Parish, town and community councils
    - District councils (lower-tier authorities)
    - Unitary authorities
    - County councils (upper-tier authorities)
    - Greater London Authority
    - National Parks UK (England)
    - National Parks UK (Wales)
  Public bodies:
    - Ambulance trusts
    - Fire and rescue authorities
    - Hospitals operated by NHS trusts and NHS foundation trusts (England)
    - Integrated Care Boards (England)
    - Internal drainage boards (England)
    - Internal drainage boards (Wales)
    - Local health boards (Wales)
    - Local resilience forums (Wales)
    - National Landscapes - areas of outstanding natural beauty (England)
    - National Landscapes - areas of outstanding natural beauty (Wales)
    - Police and crime commissioners
  Energy:
    - Electricity distributors with compulsory purchase order powers
    - Electricity generators with compulsory purchase order powers
    - Electricity interconnectors with compulsory purchase order powers
    - Offshore wind export cables and sites
    - Office for Nuclear Regulation sites
  Transport:
    - Canal or inland navigation authorities
    - Corporate joint committees (Wales)
    - Dock and harbour authorities
    - Integrated transport authorities
    - Passenger transport executives
    - Railways
  Other:
    - Ministry of Defence safeguarding areas
    - Ministry of Defence low flying areas
    - Mining remediation authority
    - Cheshire brine subsidence district
