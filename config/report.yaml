# Report: which columns each tab of the downloaded workbook shows, how much each category's map
# shows around the site, and the lines of its Summary tab. Read when the app starts
# (apps/manage/src/app/report-config.ts), which refuses to start if a value here is invalid - so a
# change is checked by `npm run check-config` and takes effect on the next deploy.
#
# A tab's columns are its `columns`, then the metadata its consultees export:
#
#   columns   the fixed columns, in order - [] for none - any of:
#               consultee               Consultee
#               category                Category
#               subcategory             Subcategory              a port's Statutory or NonStatutory...
#               subcategoryDescription  Subcategory description
#               group                   Group                    the reference data's broad group
#               region                  Region
#               whyIdentified           Why identified
#               source                  Source                   the ruleset that found it, or Manually added
#               distanceKm              Distance from site (km)
#               sourceId                ID                       the reference data's own id
#               consulteeAreaId         Consultee area id
#               geometryType            Geometry type
#               lastUpdated             Last updated
#
#   metadata  `attribute: heading` pairs, in order - the source data's attributes that become
#             columns. Attributes with the same heading share a column, so different datasets'
#             codes and names line up. Anything not listed isn't exported. A consultee without
#             an attribute leaves its cell blank.
#
#   mapKm     how much a category's map shows around the site, in km.
#
#   summary   a category's line on the Summary tab - the label it gives the category's count; or a
#             label for each buffer its conditions find it within, as { 1: ..., 10: ... }, each
#             consultee counted on the line of the nearest.
#             Each tab's lines are in the order its categories are listed here; categories with the
#             same label share a line. A line shows even when its count is 0. A category without a
#             label that has consultees in a report gets a line of its own, under its name, after
#             the tab's labelled lines - so the counts always add up to the tab's total.
#
# Each is set in `defaults`, can be set again for a tab, and `metadata` and `mapKm` again for one
# of the tab's categories - the nearest wins. A category belongs to the tab its group is named
# for in config/reference-data.yaml; list it there.

version: 2

defaults:
  columns: [sourceId, consultee, category, subcategory, whyIdentified, source]
  metadata: { CODE: External code }
  mapKm: 10

tabs:
  Administrative boundaries:
    columns: [sourceId, consultee, category, whyIdentified, source]
    categories:
      'Parish, town and community councils': { summary: 'Parish, town and community councils' }
      District councils (lower-tier authorities): { summary: District councils (lower-tier authorities) }
      Unitary authorities: { summary: Unitary authorities }
      National Parks UK (England): { summary: National Parks UK (England) }
      National Parks UK (Wales): { summary: National Parks UK (Wales) }
      County councils (upper-tier authorities): { summary: County councils (upper-tier authorities) }
      Greater London Authority: { summary: Greater London Authority }

  Public bodies:
    columns: [sourceId, consultee, category, whyIdentified, source]
    categories:
      # a line for each buffer its conditions find it within, each trust on its nearest
      Ambulance trusts: { summary: { 1: Ambulance trusts (1km buffer), 10: Ambulance trusts (10km buffer) } }
      Fire and rescue authorities:
        summary: Fire and rescue authorities
        metadata: { ONS_CODE: External code }
      Police and crime commissioners:
        summary: Police and crime commissioners
        metadata: { PFA22CD: External code, PFA22NM: Police force area }
      Hospitals operated by NHS trusts and NHS foundation trusts (England):
        { summary: Hospitals operated by NHS trusts and NHS foundation trusts (England) }
      Integrated Care Boards (England):
        summary: Integrated Care Boards (England)
        metadata: { ICB26CD: External code }
      # a drainage district's consultee is its board
      Internal drainage boards (England): { summary: Internal drainage boards (England) }
      Internal drainage boards (Wales): { summary: Internal drainage boards (Wales) }
      Local resilience forums (Wales): { summary: Local resilience forums (Wales) }
      Local health boards (Wales): { summary: Local health boards (Wales) }
      National Landscapes - areas of outstanding natural beauty (England):
        summary: National Landscapes - areas of outstanding natural beauty (England)
        metadata: { CODE: External code, NAT_ENG_CODE: Natural England code }
      National Landscapes - areas of outstanding natural beauty (Wales):
        summary: National Landscapes - areas of outstanding natural beauty (Wales)
        metadata: { CODE: External code, NAT_ENG_CODE: Natural England code }

  Energy:
    columns: [sourceId, consultee, category, subcategory, subcategoryDescription, distanceKm, whyIdentified, source]
    metadata: none
    categories:
      Electricity generators with compulsory purchase order powers:
        summary: Electricity generators with compulsory purchase order powers
        metadata:
          COMPANY_NAME: Operator
          PRIMARY_TYPE: Technology
          INSTALLED_CAPACITY_MW: Capacity (MW)
          STATUS: Status
          COMMISSIONED_DATE: Commissioned
          PINS_REFERENCE: PINS reference
          DUKES_REFERENCE: DUKES reference
      Offshore wind export cables and sites:
        summary: Offshore wind export cables and sites
        metadata: { TENANT: Operator }
      Office for Nuclear Regulation sites: { summary: Office for Nuclear Regulation sites }
      Electricity distributors with compulsory purchase order powers:
        { summary: Electricity distributors with compulsory purchase order powers }
      Electricity interconnectors with compulsory purchase order powers:
        summary: Electricity interconnectors with compulsory purchase order powers
        metadata: { LICENSEE: Operator, STATUS: Status }

  Transport:
    columns: [sourceId, consultee, category, subcategory, subcategoryDescription, distanceKm, whyIdentified, source]
    metadata: none
    categories:
      Canal or inland navigation authorities: { summary: Canal or inland navigation authorities }
      Railways:
        summary: Railways
        metadata: { STATUS: Status, HS2: HS2 }
      Passenger transport executives:
        summary: Passenger transport executives
        metadata: &combined_authority { COMB_AUTH_CODE: External code, PTE_NAME: Passenger transport executive }
      Integrated transport authorities:
        summary: Integrated transport authorities
        metadata: *combined_authority
      Dock and harbour authorities:
        summary: Dock and harbour authorities
        metadata:
          STATUS: Ownership
          MAJOR_PORT: Major port
          STATUTORY_HARBOUR_AUTHORITY: Statutory harbour authority
          COMPETENT_HARBOUR_AUTHORITY: Competent harbour authority
      Corporate joint committees (Wales):
        summary: Corporate joint committees (Wales)
        metadata: { CTYUA23NM: Member councils }

  Other:
    categories:
      Ministry of Defence safeguarding areas: { summary: Ministry of Defence safeguarding areas }
      Ministry of Defence low flying areas: { summary: Ministry of Defence low flying areas }
      Mining remediation authority: { summary: Mining remediation authority }
      Cheshire brine subsidence district: { summary: Cheshire brine subsidence district }

  NSIPs:
    # its own fields alone (see NSIP_FIELDS in workbook.ts): the project, its case reference, its
    # type and sub-type from that reference, its stage as CBOS last gave it, and the query that
    # found it - "35km buffer"
    columns: []
    # as far as config/nearby-consultees.yaml's nsipRadiusKm looks, so the cases found fit the map
    mapKm: 35
    metadata:
      Name: Name
      Number: Number
      Type: Type
      Sub-type: Sub-type
      Stage: Stage
      Query: Query
    categories:
      NSIPs: { summary: National infrastructure projects }
