trigger: none

pr: none

# Only the newest waiting run takes an environment's exclusive lock; older queued runs are cancelled,
# so the latest commit always lands last. Deploy and Infrastructure CD share the Dev/Test/Training/Prod
# environments, so this stops a stale Deploy swapping slots after a newer one (Dev ended up a commit
# behind main on 9 Oct) and Terraform changing app settings mid-swap (409 Conflict). It only takes
# effect once each environment has an "Exclusive lock" check - see AGENTS.md.
lockBehavior: runLatest

resources:
  pipelines:
    - pipeline: terraform-ci
      source: Infrastructure PR
      trigger:
        branches:
          include:
            - main
  repositories:
    - repository: templates
      type: github
      endpoint: github.com_Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.30.0

extends:
  template: pipelines/terraform_plan_apply.yml@templates
  parameters:
    environments:
      - name: Dev
      - name: Test
        dependsOn:
          - Dev
      - name: Training
        dependsOn:
          - Test
      - name: Prod
        dependsOn:
          - Training
    serviceConnectionPrefix: Azure DevOps Pipelines - Identify Consultees - Infrastructure
    storageAccountName: pinssttfstateconsultees
    resourceGroupName: pins-rg-shared-terraform-uks
    containerPrefix: terraform-state-consultees-
    workingDirectory: $(Build.Repository.LocalPath)/infrastructure
    environmentVarFilePath: $(Build.Repository.LocalPath)/infrastructure/environments
